title: Scheduled Task Created Pointing to User-Writable Directory
id: e5f4a3b2-c1d0-4e9f-a8b7-c6d5e4f3a2b1
status: experimental
description: |
  Detects schtasks.exe creating a task that executes from a user-writable location
  such as AppData, Temp, or Users\Public. A common persistence technique for commodity malware.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Your Name
date: 2026-09-28
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_create:
    CommandLine|contains: '/create'
  selection_path:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
  condition: all of selection_*
falsepositives:
  - Software updaters that install per-user (e.g., browser or chat app updaters). Filter by signed binaries.
level: high
