title: Suspicious Encoded PowerShell Command Line
id: a3f1c2d4-5b6e-4f70-8a91-2b3c4d5e6f70
status: experimental
description: |
  Detects PowerShell launched with an encoded command. Attackers use Base64-encoded
  commands to hide payloads from command-line logging and casual review.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Your Name
date: 2026-09-28
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_cli:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  condition: all of selection_*
falsepositives:
  - Some management tools (SCCM, RMM agents) legitimately use encoded commands. Baseline and filter by parent process.
level: medium
